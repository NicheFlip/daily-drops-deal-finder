name: Amazon automated deal research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amazon-scan.yml'
      - 'amazon_scan.py'
      - 'scan_health.py'
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deal-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan Amazon official catalog
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python amazon_scan.py
      - name: Verify Amazon actually returned products and refreshed feed
        id: scan_health
        continue-on-error: true
        run: python scan_health.py
      - name: Verify deal engine and frontend after scan
        continue-on-error: true
        run: python -m unittest -v test_deal_engine.py test_scanner_integration.py test_database.py test_export_history.py test_frontend.py
      - name: Archive observations in PostgreSQL (if configured)
        id: database_archive
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            python -m pip install 'psycopg[binary]>=3.2,<4'
            python database.py
            python export_history.py
          else
            echo 'DATABASE_URL not configured; PostgreSQL archive skipped.'
          fi
      - name: Report PostgreSQL archive failure
        if: steps.database_archive.outcome == 'failure'
        run: echo 'WARNING - PostgreSQL archive failed. Amazon research JSON will still publish. Review archive step logs and DATABASE_URL secret.'
      - name: Publish research data with retry
        run: |
          set -euo pipefail
          git config user.name "deal-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-all-products.json data/amazon-scan-health.json data/amazon-deals.json data/amazon-scan-state.json data/amazon-price-history.json data/amazon-deal-changes.json data/amazon-candidates.json data/amazon-candidate-state.json data/amazon-discovery-archive.json data/price-history-public.json
          if git diff --cached --quiet; then
            echo "::error::No scan files changed. Refusing to report a successful refresh."
            exit 1
          fi
          git commit -m "Refresh Amazon deal research"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Could not reconcile scanner changes with main"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Scanner feed pushed successfully on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Scanner could not publish after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          git fetch origin main
          published="$(git show origin/main:data/amazon-deals.json | python -c 'import json,sys; print(json.load(sys.stdin)["updated"])')"
          local="$(python -c 'import json; print(json.load(open("data/amazon-deals.json"))["updated"])')"
          echo "Published scan: $published"
          if [ "$published" != "$local" ]; then
            echo "::error::Published feed timestamp differs from generated scan"
            exit 1
          fi

      - name: Fail workflow if scan produced no valid data
        if: steps.scan_health.outcome == 'failure'
        run: |
          echo 'Amazon scan validation failed: see data/amazon-scan-health.json for reasons.'
          exit 1
