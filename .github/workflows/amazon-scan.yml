name: Amazon automated deal research
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deal-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify deal engine before scanning
        run: python -m unittest -v test_deal_engine.py test_scanner_integration.py test_database.py
      - name: Scan Amazon official catalog
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python amazon_scan.py
      - name: Archive observations in PostgreSQL (if configured)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            python -m pip install 'psycopg[binary]>=3.2,<4'
            python database.py
          else
            echo 'DATABASE_URL not configured; PostgreSQL archive skipped.'
          fi
      - name: Publish research data
        run: |
          git config user.name "deal-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-deals.json data/amazon-scan-state.json data/amazon-price-history.json data/amazon-deal-changes.json data/amazon-candidates.json data/amazon-candidate-state.json data/amazon-discovery-archive.json
          git diff --cached --quiet || (git commit -m "Refresh Amazon deal research" && git pull --rebase && git push)
