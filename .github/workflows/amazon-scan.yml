name: Amazon automated deal research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amazon-scan.yml'
      - 'amazon_scan.py'
      - 'scan_health.py'
      - 'data/watchlist.json'
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: deal-research
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Always scan from the newest published data, even for push-triggered runs.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan Amazon official catalog
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_SCAN_REQUEST_BUDGET: '160'
        run: python amazon_scan.py
      - name: Verify Amazon actually returned products and refreshed feed
        id: scan_health
        continue-on-error: true
        run: python scan_health.py
      - name: Verify deal engine and frontend after scan
        continue-on-error: true
        run: python -m unittest -v test_deal_engine.py test_scanner_integration.py test_database.py test_export_history.py test_frontend.py test_amazon_scan_budget.py test_amazon_used_offers.py test_amazon_shipping.py test_dedupe_history.py test_watchlist.py test_dashboard_logic.py test_posted_deals.py
      - name: Archive observations in PostgreSQL (if configured)
        id: database_archive
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            python -m pip install 'psycopg[binary]>=3.2,<4'
            python database.py
            python export_history.py
          else
            echo 'DATABASE_URL not configured; PostgreSQL archive skipped.'
          fi
      - name: Report PostgreSQL archive failure
        if: steps.database_archive.outcome == 'failure'
        run: echo 'WARNING - PostgreSQL archive failed. Amazon research JSON will still publish. Review archive step logs and DATABASE_URL secret.'
      - name: Reject failed scan before publishing public data
        if: steps.scan_health.outcome == 'failure'
        run: |
          echo '::error::Amazon scan validation failed; refusing to publish an unhealthy feed.'
          cat data/amazon-scan-health.json || true
          exit 1
      - name: Publish research data with retry
        run: |
          set -euo pipefail
          git config user.name "deal-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Generated files are copied over the newest main instead of being line-merged
          # by a rebase (a JSON line merge can mix two scans and duplicate products).
          FILES="data/amazon-all-products.json data/amazon-scan-health.json data/amazon-deals.json data/amazon-scan-state.json data/amazon-price-history.json data/amazon-deal-changes.json data/amazon-candidates.json data/amazon-candidate-state.json data/amazon-discovery-archive.json data/price-history-public.json data/amazon-used-offers.json"
          mkdir -p /tmp/scan-out
          for f in $FILES; do cp "$f" /tmp/scan-out/; done
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            for f in $FILES; do cp "/tmp/scan-out/$(basename "$f")" "$f"; done
            git add $FILES
            if git diff --cached --quiet; then
              echo "::error::No scan files changed. Refusing to report a successful refresh."
              exit 1
            fi
            git commit -m "Refresh Amazon deal research"
            if git push origin HEAD:main; then
              echo "Scanner feed pushed successfully on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::Scanner could not publish after 4 attempts"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          git fetch origin main
          published="$(git show origin/main:data/amazon-deals.json | python -c 'import json,sys; print(json.load(sys.stdin)["updated"])')"
          local="$(python -c 'import json; print(json.load(open("data/amazon-deals.json"))["updated"])')"
          echo "Published scan: $published"
          if [ "$published" != "$local" ]; then
            echo "::error::Published feed timestamp differs from generated scan"
            exit 1
          fi

