name: Amazon Creators API connection check
on:
  workflow_dispatch:
  schedule:
    - cron: '43 8 * * *'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Amazon OAuth without logging credentials
        env:
          AMAZON_CREATORS_CREDENTIAL_ID: ${{ secrets.AMAZON_CREATORS_CREDENTIAL_ID }}
          AMAZON_CREATORS_SECRET: ${{ secrets.AMAZON_CREATORS_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          AMAZON_CREATORS_VERSION: '3.1'
        run: python amazon_check.py
      - name: Save connection status
        run: |
          git config user.name "deal-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/amazon-status.json
          git diff --cached --quiet || (git commit -m "Update Amazon connection status" && git push)
