name: Publish verified community deal
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.event.issue.user.login == 'NicheFlip' && github.event.issue.title == 'Publish verified community deal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and save deal
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python publish_community_deal.py
      - name: Commit verified deal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/community-verified.json
          git diff --cached --quiet || (git commit -m "Publish owner-verified community deal" && git push)
      - name: Close processed request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Verified community deal saved to the dashboard and follower shop feed."
