name: Publish Deal Finder website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Amazon automated deal research', 'Impact deal research scanner', 'Walmart research scanner']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build minimal public site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          # Publish only explicitly approved public feeds; never copy the whole data directory.
          for file in \
            amazon-deals.json deals.json amazon-scan-health.json \
            amazon-all-products.json amazon-candidates.json \
            amazon-discovery-archive.json amazon-price-history.json \
            amazon-deal-changes.json price-history-public.json \
            impact-deals.json impact-status.json \
            walmart-research.json walmart-products.json walmart-price-history.json \
            amazon-used-deals.json featured-finds.json
          do
            if [ -f "data/$file" ]; then
              cp "data/$file" "_site/data/$file"
            fi
          done
          for file in shop.html shop-sw.js manifest.webmanifest app-icon.svg; do
            if [ -f "$file" ]; then cp "$file" "_site/$file"; fi
          done
          touch _site/.nojekyll
          echo "Public feed files included:"
          find _site/data -maxdepth 1 -type f -printf '%f\\n' | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
