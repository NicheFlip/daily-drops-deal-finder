name: Publish Deal Finder website
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build minimal public site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/amazon-deals.json _site/data/amazon-deals.json
          cp data/deals.json _site/data/deals.json
          for file in amazon-price-history.json amazon-deal-changes.json; do
            if [ -f "data/$file" ]; then cp "data/$file" "_site/data/$file"; fi
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
